<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCVTC66 — Chauffeur VTC à Perpignan</title>
  <meta name="description" content="DCVTC66, chauffeur VTC à Perpignan, propose des trajets fiables, confortables et ponctuels dans tout le département 66 et au-delà. Réservation simple et rapide." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=500;700&family=Poppins:wght=300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=99" />
  <link rel="icon" type="image/png" href="LOGO DCVTC66.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <link rel="canonical" href="https://dcvtc66.fr/" />

  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; box-sizing: border-box; }

    .nav-inner ul { display: flex; gap: 1rem; list-style: none; padding-left: 0; margin: 0; }
    .nav-inner ul li a { text-decoration: none; }

    .header { padding-top: 1rem !important; }
    .section, .section-alt { padding-top: 2rem !important; padding-bottom: 2rem !important; }
    .section-title { margin-top: 0 !important; margin-bottom: 1rem !important; }

    .branding {
      padding: 2.5rem 2.5rem !important;
      max-width: 900px !important;
      width: 100%;
      margin: 0.5rem auto 0 auto !important;
      border-radius: 24px;
      box-sizing: border-box;
    }

    .form-compact { max-width: 900px !important; width: 100%; margin: 0 auto; box-sizing: border-box; }
    .logo { max-width: 120px !important; height: auto; margin: 0 auto 1rem auto !important; display: block; }
    .site-title { margin-bottom: 0.2rem; font-size: 2.4rem; }
    .site-subtitle { margin-top: 0; font-size: 1.05rem; max-width: 85%; margin-left: auto; margin-right: auto; opacity: 0.9; }

    .hero-actions { 
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; 
      margin-top: 1.8rem; justify-content: center; max-width: 600px; margin-left: auto; margin-right: auto;
    }
    .hero-actions a.btn-primary { 
      display: inline-flex; align-items: center; justify-content: center; 
      padding: 0.85rem 0.5rem; font-size: 0.85rem; border-radius: 999px; 
      text-align: center; white-space: nowrap; font-weight: 600; letter-spacing: 0.03em;
    }

    .hero-fast-estimate {
      background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2); padding: 2rem; border-radius: 20px;
      margin: 2rem auto 0 auto; max-width: 750px; width: 100%; box-sizing: border-box;
    }
    .hero-fast-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem; }
    .hero-fast-fields input {
      padding: 1.1rem 1.3rem; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.9); font-size: 1.05rem; color: #333; width: 100%; box-sizing: border-box; font-weight: 500;
    }
    .btn-fast-calc {
      width: 100%; padding: 1.1rem; border-radius: 14px; border: none; background: #16a34a;
      color: white; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: background 0.2s;
    }

    /* --- TARIF FLOTTANT AGRANDI ET CENTRÉ --- */
    #tarif-flottant {
      position: fixed; 
      top: 20px; 
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000; 
      display: none; /* Apparaît après clic estimation */
      align-items: center; 
      justify-content: center;
      gap: 1rem;
      padding: 1.2rem 2.5rem; 
      border-radius: 999px; 
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white; 
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); 
      font-size: 1.2rem; 
      font-weight: 700; 
      width: auto;
      min-width: 300px;
      max-width: 90vw;
      border: 2px solid rgba(255, 255, 255, 0.3); 
      animation: pulseTarif 1.6s ease-in-out infinite;
    }
    #tarif-flottant .icon { font-size: 1.6rem; }
    
    @keyframes pulseTarif {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .form-compact .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-compact label { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; font-weight: 500; }
    .form-compact input, .form-compact select, .form-compact textarea { padding: 1rem; border-radius: 14px; font-size: .95rem; }

    .dates-retour-container { display: none; margin-top: 0.5rem; }

    .actions-compact{ display:grid; grid-template-columns: 1fr 1.15fr; gap:1rem; margin-top:1rem; }
    .actions-compact .btn-primary, .actions-compact .btn-estimate{ border-radius:999px; padding:1rem; font-weight:800; }
    .email-action{ margin-top: .8rem; width: 100%; display: inline-flex; justify-content: center; align-items: center; border-radius: 999px; padding: 1rem; font-weight: 800; }

    .result-compact, .error-compact{ margin-top:.6rem; padding:.65rem .75rem; border-radius:12px; font-size:.85rem; }
    .result-compact{ background:#f0f7ff; color:#1b3b68; }
    .error-compact{ background:#ffecec; color:#a40000; }

    .map-wrapper-inner { position:relative; width:100%; height:320px; border-radius: 16px; overflow: hidden; margin-top: 1rem; }
    #map { width:100%; height:100%; }

    @media (max-width: 768px) {
      .hero-actions { grid-template-columns: 1fr; gap: 0.5rem; }
      .hero-fast-fields { grid-template-columns: 1fr; }
      #tarif-flottant { padding: 1rem; font-size: 1rem; min-width: 280px; }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <div class="container nav-inner">
      <ul>
        <li><a href="#reservation">Réservation</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="header">
    <div class="container">
      <div class="branding">
        <img src="LOGO DCVTC66.png" alt="Logo DCVTC66" class="logo">
        <h1 class="site-title">DCVTC66</h1>
        <p class="site-subtitle">Chauffeur VTC privé à Perpignan (66)</p>

        <div class="hero-actions">
          <a href="tel:0663463716" class="btn-primary">📞 APPELER</a>
          <a href="https://wa.me/33663463716" target="_blank" class="btn-primary">💬 WHATSAPP</a>
          <a href="#reservation" class="btn-primary">📝 RÉSERVER</a>
        </div>

        <div class="hero-fast-estimate">
          <div class="hero-fast-fields">
            <input type="text" id="fast-depart" placeholder="📍 Adresse de départ">
            <input type="text" id="fast-arrivee" placeholder="🏁 Adresse d'arrivée">
          </div>
          <button type="button" id="btn-fast-calc" class="btn-fast-calc">💰 Estimer mon trajet en 1 clic</button>
        </div>
      </div>
    </div>
  </header>

  <section id="reservation" class="section-alt">
    <div class="container">
      <h2 class="section-title" style="text-align:center">Réservation</h2>
      <form id="reservation-form" class="form-compact">
        <div class="row">
          <label>Nom <input type="text" name="Nom" placeholder="Nom & prénom" required></label>
          <label>Téléphone <input type="tel" name="Téléphone" placeholder="06…" required></label>
        </div>
        <label>Type de trajet
          <select name="Trajet" id="trajet-type">
            <option value="simple">Aller simple</option>
            <option value="aller-retour">Aller-Retour (-10% sur retour)</option>
          </select>
        </label>
        <label>Départ <input type="text" name="Départ" placeholder="Lieu de départ" required></label>
        <label>Arrivée <input type="text" name="Arrivee" placeholder="Lieu d'arrivée" required></label>
        <label>Date & heure aller <input type="datetime-local" name="DateHeureAller" required></label>
        <div id="dates-retour-container" class="dates-retour-container">
          <label>Date & heure retour <input type="datetime-local" name="DateHeureRetour" id="date-retour"></label>
        </div>
        <label>Passagers
          <select name="Passagers" required><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
        </label>
        <label>Paiement
          <select name="Paiement" required><option value="CB à bord">CB à bord</option><option value="Espèces">Espèces</option></select>
        </label>
        <div class="actions-compact">
          <button type="button" id="btn-tarif" class="btn-estimate">Estimer</button>
          <button type="submit" class="btn-primary">📩 SMS</button>
        </div>
        <div id="resultat-tarif" class="result-compact" style="display:none;"></div>
        <div class="map-wrapper-inner"><div id="map"></div></div>
      </form>
    </div>
  </section>

  <div id="tarif-flottant">
    <span class="icon">💰</span>
    <span id="tarif-flottant-texte">Calcul...</span>
  </div>

  <script>
    const form = document.getElementById('reservation-form');
    const trajetSelect = document.getElementById('trajet-type');
    const datesRetourContainer = document.getElementById('dates-retour-container');
    const dateRetourInput = document.getElementById('date-retour');
    let derniereEstimation = null;

    trajetSelect.addEventListener('change', () => {
      datesRetourContainer.style.display = trajetSelect.value === 'aller-retour' ? 'block' : 'none';
    });

    function calculerTarif() {
      const dep = form["Départ"].value;
      const arr = form["Arrivee"].value;
      if(!dep || !arr) return alert("Indiquez le départ et l'arrivée");

      const resDiv = document.getElementById("resultat-tarif");
      const flottant = document.getElementById("tarif-flottant");
      const flottantTexte = document.getElementById("tarif-flottant-texte");

      // Simulation de calcul (votre logique DistanceMatrix doit être active avec votre clé API)
      const distanceSimulee = 15; 
      const prix = 25.50;

      derniereEstimation = { distanceKm: distanceSimulee, tarif: prix };
      
      resDiv.style.display = "block";
      resDiv.innerHTML = `Estimation : <strong>${prix.toFixed(2)} €</strong>`;
      
      flottantTexte.textContent = `Tarif estimé : ${prix.toFixed(2)} €`;
      flottant.style.display = "flex";
    }

    document.getElementById("btn-tarif").addEventListener("click", calculerTarif);
    document.getElementById("btn-fast-calc").addEventListener("click", () => {
      form["Départ"].value = document.getElementById("fast-depart").value;
      form["Arrivee"].value = document.getElementById("fast-arrivee").value;
      calculerTarif();
    });

    function initMap() {
      // Remplacez par votre clé API valide pour activer Google Maps
      console.log("Map prête");
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=VOTRE_CLE_ICI&callback=initMap&libraries=places" async defer></script>
</body>
</html>
