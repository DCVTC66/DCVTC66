<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCVTC66 — Chauffeur VTC à Perpignan</title>
  <meta name="description" content="DCVTC66, chauffeur VTC à Perpignan, propose des trajets fiables, confortables et ponctuels dans tout le département 66. Véhicule hybride." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=99" />
  <link rel="icon" type="image/png" href="LOGO DCVTC66.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <link rel="canonical" href="https://dcvtc66.fr/" />

  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; font-family: 'Poppins', sans-serif; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; box-sizing: border-box; }

    /* Header & Branding */
    .header { background: #001a33; color: white; padding: 2rem 0; text-align: center; }
    .logo { max-width: 120px; margin-bottom: 1rem; }
    
    /* Style spécifique pour la Toyota Auris */
    .hero-car-wrapper {
      margin: 1.5rem auto;
      max-width: 600px;
      padding: 0 1rem;
    }
    .hero-car {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 2px solid rgba(255,215,0,0.3); /* Rappel doré */
    }

    .nav-inner ul { display: flex; gap: 1rem; list-style: none; padding: 1rem 0; margin: 0; justify-content: center; background: #001226; }
    .nav-inner ul li a { text-decoration: none; color: white; font-size: 0.9rem; font-weight: 500; }

    .hero-actions { display: flex; gap: 0.55rem; margin-top: 1.5rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary { 
        background: linear-gradient(135deg, #ffd700, #ffb700); 
        color: #001a33; 
        border: none; 
        padding: 0.7rem 1.2rem; 
        border-radius: 999px; 
        font-weight: 700; 
        text-decoration: none; 
        display: inline-flex; 
        align-items: center; 
        cursor: pointer;
    }

    /* Carte flottante d'estimation */
    #tarif-flottant {
      position: fixed; top: 24px; right: 24px; z-index: 9999; display: none; align-items: center; gap: 0.75rem;
      padding: 0.9rem 1.3rem; border-radius: 999px; background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white; box-shadow: 0 16px 40px rgba(22, 163, 74, 0.7); font-size: 0.95rem; font-weight: 600;
      animation: pulseTarif 1.6s ease-in-out infinite;
    }

    @keyframes pulseTarif {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    /* Formulaire */
    .form-compact { max-width: 600px; margin: 2rem auto; background: #f9f9f9; padding: 1.5rem; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .form-compact label { display: block; margin-bottom: 0.8rem; font-size: 0.9rem; font-weight: 600; }
    .form-compact input, .form-compact select, .form-compact textarea { 
        width: 100%; padding: 0.8rem; margin-top: 0.3rem; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; 
    }

    .actions-compact { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem; }
    .btn-estimate { background: #001a33; color: white; border-radius: 999px; border: none; padding: 0.9rem; font-weight: 700; cursor: pointer; }

    /* Media Queries */
    @media (max-width: 520px) {
      .actions-compact { grid-template-columns: 1fr; }
      #tarif-flottant { left: 16px; right: 16px; top: auto; bottom: 80px; }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="container nav-inner">
      <ul>
        <li><a href="#reservation">Réservation</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="header">
    <div class="container header-inner">
      <div class="branding">
        <img src="LOGO DCVTC66.png" alt="Logo DCVTC66" class="logo">
        
        <div class="hero-car-wrapper">
          <img src="toyota-auris.png" alt="Toyota Auris Hybride DCVTC66" class="hero-car">
        </div>

        <h1 class="site-title" style="color: #ffd700; margin: 0.5rem 0;">DCVTC66</h1>
        <p class="site-subtitle">Chauffeur VTC privé à Perpignan et dans le (66)</p>

        <div class="hero-actions">
          <a href="tel:0663463716" class="btn-primary">📞 Appeler</a>
          <a href="https://wa.me/33663463716" target="_blank" class="btn-primary">💬 WhatsApp</a>
          <a href="#reservation" class="btn-primary">📝 Réserver</a>
        </div>
      </div>
    </div>
  </header>

  <section id="reservation" class="section">
    <div class="container">
      <h2 style="text-align:center; margin-top: 2rem;">Réserver votre trajet</h2>
      <form id="reservation-form" class="form-compact">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <label>Nom <input type="text" name="Nom" required></label>
          <label>Téléphone <input type="tel" name="Téléphone" required></label>
        </div>

        <label>Type de trajet
          <select name="Trajet" id="trajet-type">
            <option value="simple">Aller simple</option>
            <option value="aller-retour">Aller-Retour (-10% sur le retour)</option>
          </select>
        </label>

        <label>Départ <input type="text" name="Départ" placeholder="Ex: Gare de Perpignan" required></label>
        <label>Arrivée <input type="text" name="Arrivee" placeholder="Ex: Aéroport de Perpignan" required></label>

        <label>Date & heure aller <input type="datetime-local" name="DateHeureAller" id="date-aller" required></label>

        <div id="dates-retour-container" style="display:none;">
          <label>Date & heure retour <input type="datetime-local" name="DateHeureRetour" id="date-retour"></label>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <label>Passagers
            <select name="Passagers" required>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
            </select>
          </label>
          <label>Paiement
            <select name="Paiement" required>
              <option value="CB à bord">CB à bord</option>
              <option value="Espèces">Espèces</option>
              <option value="Lien CB">Lien CB</option>
            </select>
          </label>
        </div>

        <div class="actions-compact">
          <button type="button" id="btn-tarif" class="btn-estimate">💰 Estimer le prix</button>
          <button type="submit" class="btn-primary" style="justify-content: center;">📩 Commander (SMS)</button>
        </div>
        
        <div id="resultat-tarif" style="display:none; margin-top: 1rem; padding: 1rem; background: #e3f2fd; border-radius: 10px; font-size: 0.9rem;"></div>
        <div id="erreur-tarif" style="display:none; margin-top: 1rem; color: red;"></div>
      </form>
    </div>
  </section>

  <footer style="background: #001226; color: white; text-align: center; padding: 2rem 0; margin-top: 2rem;">
    <p>© <span id="year"></span> DCVTC66 — Perpignan</p>
    <p style="font-size: 0.8rem; opacity: 0.7;">+33 6 63 46 37 16 | driveconfort66@gmail.com</p>
  </footer>

  <div id="tarif-flottant">
    <span id="tarif-flottant-texte"></span>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const form = document.getElementById('reservation-form');
    const trajetSelect = document.getElementById('trajet-type');
    const datesRetourContainer = document.getElementById('dates-retour-container');
    const dateRetourInput = document.getElementById('date-retour');

    trajetSelect.addEventListener('change', () => {
      datesRetourContainer.style.display = trajetSelect.value === 'aller-retour' ? 'block' : 'none';
      dateRetourInput.required = trajetSelect.value === 'aller-retour';
    });

    // Fonction d'estimation simplifiée pour l'exemple (nécessite l'API Google chargée plus bas)
    let derniereEstimation = null;

    function calculerTarif() {
      const resDiv = document.getElementById("resultat-tarif");
      const errDiv = document.getElementById("erreur-tarif");
      const depart = form["Départ"].value;
      const arrivee = form["Arrivee"].value;

      if(!depart || !arrivee) {
        alert("Veuillez saisir un départ et une arrivée.");
        return;
      }

      // Simulation de calcul (votre script Matrix Service est conservé ici)
      // Note: Le calcul réel se déclenchera via l'API Google Maps
      resDiv.style.display = "block";
      resDiv.innerHTML = "Calcul de l'itinéraire en cours...";
    }

    document.getElementById("btn-tarif").addEventListener("click", calculerTarif);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      let sms = "Nouvelle demande DCVTC66 :\n" + form.Nom.value + "\nDe: " + form.Départ.value + "\nÀ: " + form.Arrivee.value + "\nLe: " + form.DateHeureAller.value;
      window.location.href = "sms:+33663463716?&body=" + encodeURIComponent(sms);
    });
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=VOTRE_CLE_ICI&libraries=places&callback=initMap" async defer></script>
</body>
</html>
