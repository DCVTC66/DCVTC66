  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; box-sizing: border-box; }

    .nav-inner ul { display: flex; gap: 1rem; list-style: none; padding-left: 0; margin: 0; }
    .nav-inner ul li a { text-decoration: none; }

    /* --- REMONTÉE GÉNÉRALE DES SECTIONS --- */
    .header {
      padding-top: 1rem !important;
    }
    
    .section, .section-alt {
      padding-top: 2rem !important; 
      padding-bottom: 2rem !important;
    }

    .section-title {
      margin-top: 0 !important;
      margin-bottom: 1rem !important;
    }

    /* --- CARRÉ BLEU CENTRAL ET FORMULAIRE AGRANDIS (PC) --- */
    .branding {
      padding: 3rem 2.5rem !important;
      max-width: 960px !important;
      width: 100%;
      margin: 0.5rem auto 0 auto !important;
      border-radius: 24px;
      box-sizing: border-box;
    }

    .form-compact { 
      max-width: 960px !important;
      width: 100%; 
      margin: 0 auto; 
      box-sizing: border-box;
    }

    /* Logo calé en haut */
    .logo {
      max-width: 120px !important;
      height: auto;
      margin: 0 auto 1rem auto !important;
      display: block;
    }

    .site-title { margin-bottom: 0.2rem; font-size: 2.4rem; }
    .site-subtitle { margin-top: 0; font-size: 1.05rem; max-width: 85%; margin-left: auto; margin-right: auto; opacity: 0.9; }

    /* Boutons jaunes */
    .hero-actions { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 1.5rem; 
      margin-top: 1.8rem; 
      justify-content: center; 
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .hero-actions a.btn-primary { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      padding: 0.85rem 0.5rem; 
      font-size: 0.85rem; 
      border-radius: 999px; 
      text-align: center; 
      white-space: nowrap; 
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* ==========================================
       ZONE D'ESTIMATION MODIFIÉE (PC PAR DÉFAUT)
       ========================================== */
    .hero-fast-estimate {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 22px !important; 
      border-radius: 20px;
      margin: 1.5rem auto 0 auto;
      max-width: 650px !important; 
      width: 100%;
      box-sizing: border-box;
    }
    .hero-fast-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem; 
      margin-bottom: 1rem;
    }
    .hero-fast-fields input {
      padding: 1rem 1.2rem !important; 
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.9);
      font-size: 1rem; 
      color: #333;
      width: 100%;
      box-sizing: border-box;
      font-weight: 500;
    }
    .btn-fast-calc {
      width: 100%;
      padding: 11px 22px !important; 
      border-radius: 14px;
      border: none;
      background: #16a34a;
      color: white;
      font-weight: 700;
      font-size: 1.05rem; 
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-fast-calc:hover { background: #15803d; }

    #btn-install.btn-primary {
      margin-top: 1.2rem;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    /* --- TARIF FLOTTANT --- */
    #tarif-flottant {
      position: fixed; 
      top: 24px; 
      left: 50%; 
      transform: translateX(-50%) scale(1);
      z-index: 9999; 
      display: none !important; 
      align-items: center; 
      justify-content: center;
      gap: 1rem;
      padding: 1.2rem 2.5rem; 
      border-radius: 999px; 
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #022c22; 
      box-shadow: 0 20px 50px rgba(22, 163, 74, 0.8); 
      font-size: 1.3rem; 
      font-weight: 700; 
      width: max-content;
      max-width: 90vw;
      border: 2px solid rgba(255, 255, 255, 0.4);
      animation: pulseTarifCentrer 1.8s ease-in-out infinite;
    }
    #tarif-flottant .icon { font-size: 1.7rem; }
    
    @keyframes pulseTarifCentrer {
      0% { transform: translateX(-50%) scale(1); box-shadow: 0 15px 35px rgba(22, 163, 74, 0.6); }
      50% { transform: translateX(-50%) scale(1.04); box-shadow: 0 25px 55px rgba(22, 163, 74, 0.9); }
      100% { transform: translateX(-50%) scale(1); box-shadow: 0 15px 35px rgba(22, 163, 74, 0.6); }
    }

    .section-intro { margin-bottom: 0.75rem; }
    .form-compact .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-compact label { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; font-weight: 500; letter-spacing: .02em; }
    .form-compact input, .form-compact textarea { padding: 1rem 1rem; border-radius: 14px; font-size: .95rem; line-height: 1.4; }
    .form-compact select { padding: 1rem 1rem; border-radius: 14px; font-size: .95rem; line-height: 1.4; }
    .form-compact textarea { resize: vertical; min-height: 72px; }

    .dates-retour-container {
      display: none;
      margin-top: 0.5rem;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    details.opt { margin-top: .45rem; }
    details.opt summary { cursor: pointer; font-weight: 700; opacity: .9; margin: .35rem 0 .25rem; }

    .actions-compact{
      display:grid;
      grid-template-columns: 1fr 1.15fr;
      gap:1rem;
      margin-top:1rem;
    }
    .actions-compact .btn-primary,
    .actions-compact .btn-estimate{
      border-radius:999px;
      padding:1rem;
      font-weight:800;
      letter-spacing:.02em;
    }

    .email-action{
      margin-top: .8rem;
      width: 100%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: 999px;
      padding: 1rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .result-compact, .error-compact{ margin-top:.6rem; padding:.65rem .75rem; border-radius:12px; font-size:.85rem; line-height:1.35; }
    .result-compact{ background:#f0f7ff; color:#1b3b68; }
    .error-compact{ background:#ffecec; color:#a40000; }

    .map-wrapper { margin-top: .7rem; border-radius: 16px; overflow: hidden; }
    .map-wrapper-inner { position:relative; width:100%; height:320px; }
    #map { width:100%; height:100%; background: #eee; display: flex; align-items: center; justify-content: center; color: #666; font-size: 0.9rem; }

    /* Responsive Mobile & Tablette */
    @media (max-width: 930px) {
      .branding, .form-compact { max-width: 96% !important; } 
    }

    @media (max-width: 768px) {
      .header { padding-top: 0.5rem !important; }
      .section, .section-alt { padding-top: 1.5rem !important; padding-bottom: 1.5rem !important; padding-left: 0.8rem; padding-right: 0.8rem; box-sizing: border-box; }
      .nav-inner ul { justify-content: center; flex-wrap: wrap; text-align: center; }
      .header-inner, .branding { text-align: center; }
      
      .branding { 
        padding: 2.2rem 1.2rem !important; 
        max-width: 96% !important; 
        margin: 0.2rem auto 0 auto !important; 
      }
      .form-compact { 
        max-width: 96% !important; 
      }
      
      .site-title { font-size: 1.9rem; }
      .hero-actions { gap: 0.6rem; max-width: 100%; }
      .hero-actions a.btn-primary { font-size: 0.75rem; padding: 0.75rem 0.3rem; }
      
      .hero-fast-estimate { 
        padding: 12px !important; 
        margin-top: 1.2rem; 
      }
      .hero-fast-fields { grid-template-columns: 1fr; gap: 0.6rem; margin-bottom: 0.6rem; }
      .hero-fast-fields input { padding: 0.85rem 1rem !important; font-size: 1rem; } 
      .btn-fast-calc { 
        padding: 9px 15px !important; 
        font-size: 1rem; 
        height: auto !important;
      }
    }

    @media (max-width: 520px){
      .form-compact .row{ grid-template-columns: 1fr; }
      #tarif-flottant { left: 50%; top: 20px; width: 92vw; padding: 1rem 1rem; font-size: 1.05rem; }
      .actions-compact{ grid-template-columns: 1fr; gap: .55rem; }
      .actions-compact .btn-primary,
      .actions-compact .btn-estimate,
      .email-action{ 
        width: 100%; 
        padding: 0.9rem 1rem; 
        font-size: 0.95rem; 
      }
      .map-wrapper-inner{ height: 280px; }
      #btn-install.btn-primary{ width: 100%; max-width: 320px; margin-left: auto !important; margin-right: auto !important; }
      
      .container { padding: 0 0.5rem; }
      .form-compact { padding-left: 0.8rem; padding-right: 0.8rem; }
      .form-compact input, .form-compact select, .form-compact textarea { padding: 0.9rem 1rem; font-size: 1rem; }
    }
  </style>
