<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCVTC66 — Chauffeur VTC à Perpignan</title>
  <meta name="description" content="DCVTC66, chauffeur VTC à Perpignan, propose des trajets fiables, confortables et ponctuels dans tout le département 66 et au-delà. Réservation simple et rapide." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=99" />
  <link rel="icon" type="image/png" href="LOGO DCVTC66.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <link rel="canonical" href="https://dcvtc66.fr/" />

  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; box-sizing: border-box; }
    .nav-inner ul { display: flex; gap: 1rem; list-style: none; padding-left: 0; margin: 0; }
    .nav-inner ul li a { text-decoration: none; }
    .hero-actions { display: flex; gap: 0.55rem; margin-top: 1.05rem; justify-content: center; flex-wrap: wrap; }
    .hero-actions a.btn-primary { display: inline-flex; align-items: center; justify-content: center; padding: 0.45rem 0.9rem; font-size: 0.8rem; border-radius: 999px; text-align: center; white-space: nowrap; }

    #tarif-flottant {
      position: fixed; top: 24px; right: 24px; z-index: 9999; display: none; align-items: center; gap: 0.75rem;
      padding: 0.9rem 1.3rem; border-radius: 999px; background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #022c22; box-shadow: 0 16px 40px rgba(22, 163, 74, 0.7); font-size: 0.95rem; font-weight: 600; max-width: 90vw;
      border: 1px solid rgba(6, 95, 70, 0.75); animation: pulseTarif 1.6s ease-in-out infinite;
    }
    @keyframes pulseTarif { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }

    .form-compact { max-width: 560px; margin: 1.5rem auto; padding: 1rem; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .form-compact .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .form-compact label { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; font-weight: 500; }
    .form-compact input, .form-compact select, .form-compact textarea { padding: .75rem .85rem; border-radius: 14px; font-size: .92rem; border: 1px solid #ddd; }
    
    .dates-retour-container { display: none; margin-top: 0.5rem; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .actions-compact{ display:grid; grid-template-columns: 1fr 1.15fr; gap:.6rem; margin-top:.75rem; }
    .email-action{ margin-top: .6rem; width: 100%; display: inline-flex; justify-content: center; align-items: center; border-radius: 999px; padding: .9rem 1rem; font-weight: 800; }
    
    #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: opacity 0.6s; }
    #splash-screen img { width: 100px; margin-bottom: 20px; }

    @media (max-width: 520px){ .form-compact .row{ grid-template-columns: 1fr; } .actions-compact{ grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <div id="splash-screen"><img src="icon-192.png" alt="DCVTC66"><p>Connexion à votre chauffeur privé…</p></div>

  <nav class="nav"><div class="container nav-inner"><ul><li><a href="#services">Services</a></li><li><a href="#contact">Contact</a></li></ul></div></nav>

  <header class="header">
    <div class="container header-inner">
      <div class="branding">
        <img src="LOGO DCVTC66.png" alt="Logo DCVTC66" class="logo">
        <h1 class="site-title">DCVTC66</h1>
        <p class="site-subtitle">Chauffeur VTC privé à Perpignan et dans toutes les Pyrénées-Orientales (66)</p>
      </div>

      <!-- FORMULAIRE AU-DESSUS DE LA LIGNE DE FLOTTAISON -->
      <form id="reservation-form" class="form-compact">
        <div class="row">
          <label>Nom <input type="text" name="Nom" placeholder="Nom & prénom" required></label>
          <label>Téléphone <input type="tel" name="Téléphone" placeholder="06…" required></label>
        </div>
        <label>Type de trajet
          <select name="Trajet" id="trajet-type">
            <option value="simple">Aller simple</option>
            <option value="aller-retour">Aller-Retour (réduction 10% sur le retour)</option>
          </select>
        </label>
        <label>Départ <input type="text" name="Départ" placeholder="Adresse de prise en charge" required></label>
        <label>Arrivée <input type="text" name="Arrivee" placeholder="Adresse de destination" required></label>
        <label>Date & heure aller <input type="datetime-local" name="DateHeureAller" id="date-aller" required></label>
        <div id="dates-retour-container" class="dates-retour-container">
          <label>Date & heure retour <input type="datetime-local" name="DateHeureRetour" id="date-retour"></label>
        </div>
        <div class="row">
          <label>Passagers <select name="Passagers" required><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
          <label>Paiement <select name="Paiement" required><option value="CB à bord">CB à bord</option><option value="Espèces à bord">Espèces à bord</option><option value="Lien sécurisé (CB)">Lien sécurisé (CB)</option></select></label>
        </div>
        <details class="opt"><summary>+ Options</summary><textarea name="Message" rows="2" placeholder="Bagages, siège enfant..."></textarea></details>
        <div class="actions-compact">
          <button type="button" id="btn-tarif" class="btn-estimate">💰 Estimer</button>
          <button type="submit" class="btn-primary">📩 Envoyer SMS</button>
        </div>
        <button type="button" id="btn-whatsapp-form" class="btn-primary email-action">💬 Envoyer WhatsApp</button>
        <div id="erreur-tarif" class="error-compact" style="display:none;"></div>
        <div id="resultat-tarif" class="result-compact" style="display:none;"></div>
      </form>

      <div class="hero-actions">
        <a href="tel:0663463716" class="btn-primary">📞 Appeler</a>
        <a href="https://wa.me/33663463716" target="_blank" class="btn-primary">💬 WhatsApp</a>
        <a href="#" id="btn-estimer-hero" class="btn-primary">💰 Estimer</a>
      </div>
      <button id="btn-install" class="btn-primary" style="display:none; margin:10px auto;">📲 Installer l'app</button>
    </div>
  </header>

  <div id="tarif-flottant"><span class="icon">💰</span><span id="tarif-flottant-texte">Estimation en cours…</span></div>

  <script>
    document.getElementById("year") ? document.getElementById("year").textContent = new Date().getFullYear() : null;
    const form = document.getElementById('reservation-form');
    const trajetSelect = document.getElementById('trajet-type');
    const datesRetourContainer = document.getElementById('dates-retour-container');
    const dateRetourInput = document.getElementById('date-retour');

    function toggleDateRetour() {
      if (trajetSelect.value === 'aller-retour') {
        datesRetourContainer.style.display = 'block';
        dateRetourInput.required = true;
      } else {
        datesRetourContainer.style.display = 'none';
        dateRetourInput.required = false;
      }
    }
    trajetSelect.addEventListener('change', toggleDateRetour);

    function buildMsg() {
      let msg = "Nouvelle demande – DCVTC66 :\n\nNom : " + form.Nom.value + "\nDépart : " + form.Départ.value + "\nArrivée : " + form.Arrivee.value + "\nDate : " + form.DateHeureAller.value.replace("T", " à ");
      if (derniereEstimation) msg += "\nTarif : " + derniereEstimation.tarif.toFixed(2) + " €";
      return msg;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = "sms:+33663463716?&body=" + encodeURIComponent(buildMsg());
    });
    document.getElementById("btn-whatsapp-form").addEventListener("click", () => {
      window.open("https://wa.me/33663463716?text=" + encodeURIComponent(buildMsg()), "_blank");
    });

    let derniereEstimation = null;
    let distanceService;
    function initMap() {
      distanceService = new google.maps.DistanceMatrixService();
      new google.maps.places.Autocomplete(form.Départ, { componentRestrictions: { country: 'fr' } });
      new google.maps.places.Autocomplete(form.Arrivee, { componentRestrictions: { country: 'fr' } });
      document.getElementById("btn-tarif").addEventListener("click", calculerTarif);
    }

    function calculerTarif() {
      const resDiv = document.getElementById("resultat-tarif");
      distanceService.getDistanceMatrix({
        origins: [form.Départ.value], destinations: [form.Arrivee.value], travelMode: 'DRIVING'
      }, (response, status) => {
        if (status === "OK" && response.rows[0].elements[0].status === "OK") {
          const distKm = response.rows[0].elements[0].distance.value / 1000;
          let tarif = 20 + (distKm > 7 ? (distKm - 7) * 1.7 : 0);
          const heure = new Date(form.DateHeureAller.value).getHours();
          if (heure >= 21 || heure < 7) tarif *= 1.2;
          if (trajetSelect.value === "aller-retour") tarif = tarif + (tarif * 0.9);
          derniereEstimation = { tarif: tarif };
          resDiv.style.display = "block";
          resDiv.innerHTML = "Estimation : <strong>" + tarif.toFixed(2) + " €</strong>";
          document.getElementById("tarif-flottant").style.display = "flex";
          document.getElementById("tarif-flottant-texte").textContent = tarif.toFixed(2) + " €";
        }
      });
    }

    window.addEventListener("load", () => {
      const splash = document.getElementById("splash-screen");
      splash.style.opacity = "0";
      setTimeout(() => splash.remove(), 600);
    });
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCA5J7_7fNdWgVsGRLWRfQZaO6qgCEqq_Y&callback=initMap&libraries=places" async defer></script>
</body>
</html>
