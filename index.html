<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCVTC66 — Chauffeur VTC à Perpignan</title>
  <meta name="description" content="DCVTC66, chauffeur VTC à Perpignan, propose des trajets fiables, confortables et ponctuels dans tout le département 66 et au-delà." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=99" />
  <link rel="icon" type="image/png" href="LOGO DCVTC66.png">
  
  <style>
    /* STYLE PREMIUM INSPIRÉ DE L'EXEMPLE */
    :root {
      --dark-blue: #0a192f;
      --gold-gradient: linear-gradient(180deg, #ffd700 0%, #ffb800 100%);
      --text-white: #ffffff;
    }

    html, body { margin: 0; padding: 0; overflow-x: hidden; font-family: 'Poppins', sans-serif; }
    
    /* HEADER PREMIUM */
    .header-premium {
      background-color: var(--dark-blue);
      color: var(--text-white);
      text-align: center;
      padding: 2rem 1rem;
    }

    .logo-top { width: 100px; margin-bottom: 1rem; }

    /* CADRE IMAGE VOITURE */
    .car-frame {
      border: 3px solid #ffd700;
      border-radius: 25px;
      overflow: hidden;
      max-width: 450px;
      margin: 1.5rem auto;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .car-frame img { width: 100%; display: block; }

    .premium-title { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; margin: 1rem 0 0.5rem; line-height: 1.2; }
    .premium-subtitle { font-size: 0.95rem; opacity: 0.9; margin-bottom: 1.5rem; }

    /* BOUTONS JAUNES */
    .hero-actions-premium { display: flex; flex-direction: column; gap: 0.8rem; max-width: 320px; margin: 0 auto; }
    
    .btn-gold {
      background: var(--gold-gradient);
      color: #000 !important;
      text-decoration: none;
      font-weight: 800;
      padding: 0.9rem;
      border-radius: 50px;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn-gold span { font-size: 0.7rem; font-weight: 400; text-transform: none; }

    /* RESTE DU SITE (CONSERVÉ) */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; box-sizing: border-box; }
    .section { padding: 3rem 0; }
    .section-alt { background: #f4f4f4; }
    .form-compact { max-width: 560px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .form-compact label { display: block; margin-bottom: 10px; font-weight: 600; }
    .form-compact input, .form-compact select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
    
    #tarif-flottant {
      position: fixed; top: 24px; right: 24px; z-index: 9999; display: none; padding: 0.9rem 1.3rem; 
      border-radius: 999px; background: linear-gradient(135deg, #16a34a, #22c55e); color: white;
    }

    .fab { position: fixed; bottom: 20px; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; text-decoration: none; z-index: 1000; color: white; }
    .fab-call { right: 20px; background: #ffd700; color: black; }
    .fab-whatsapp { right: 90px; background: #25d366; }
  </style>
</head>

<body>

  <header class="header-premium">
    <div class="container">
      <img src="LOGO DCVTC66.png" alt="Logo DCVTC66" class="logo-top">
      
      <div class="car-frame">
        <img src="Toyota-Auris-Hybrid-Touring-Sports.0.jpg" alt="Toyota Auris Hybride DCVTC66">
      </div>

      <h1 class="premium-title">Chaque trajet, une expérience.<br>DCVTC66, votre chauffeur privé.</h1>
      <p class="premium-subtitle">À Perpignan et dans toutes les Pyrénées-Orientales (66).</p>

      <div class="hero-actions-premium">
        <a href="tel:0663463716" class="btn-gold">
          📞 APPELER MAINTENANT
          <span>(Réponse Immédiate)</span>
        </a>
        <a href="#reservation" class="btn-gold">
          📅 ESTIMER VOTRE TRAJET
          <span>(Sans Engagement)</span>
        </a>
      </div>
    </div>
  </header>

  <section id="reservation" class="section section-alt">
    <div class="container">
      <h2 style="text-align:center;">Réservation</h2>
      <form id="reservation-form" class="form-compact">
        <label>Nom <input type="text" name="Nom" placeholder="Nom & prénom" required></label>
        <label>Téléphone <input type="tel" name="Téléphone" placeholder="06…" required></label>
        <label>Type de trajet
          <select name="Trajet" id="trajet-type">
            <option value="simple">Aller simple</option>
            <option value="aller-retour">Aller-Retour (-10% sur retour)</option>
          </select>
        </label>
        <label>Départ <input type="text" name="Départ" placeholder="Adresse de départ" required></label>
        <label>Arrivée <input type="text" name="Arrivee" placeholder="Adresse d'arrivée" required></label>
        <label>Date & heure aller <input type="datetime-local" name="DateHeureAller" id="date-aller" required></label>
        
        <div id="dates-retour-container" style="display:none;">
          <label>Date & heure retour <input type="datetime-local" name="DateHeureRetour" id="date-retour"></label>
        </div>

        <label>Passagers
          <select name="Passagers" required>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          </select>
        </label>

        <button type="button" id="btn-tarif" style="width:100%; padding:15px; background:#0a192f; color:white; border-radius:50px; font-weight:bold; cursor:pointer; margin-bottom:10px;">ESTIMER LE PRIX</button>
        <button type="submit" style="width:100%; padding:15px; background:#ffd700; border:none; border-radius:50px; font-weight:bold; cursor:pointer;">📩 RÉSERVER PAR SMS</button>

        <div id="resultat-tarif" style="margin-top:15px; padding:10px; background:#eef; border-radius:10px; display:none;"></div>
        <div id="map" style="height:250px; margin-top:15px; border-radius:15px;"></div>
      </form>
    </div>
  </section>

  <footer style="text-align:center; padding:2rem; background:#0a192f; color:white;">
    <p>© 2026 DCVTC66 — Perpignan</p>
  </footer>

  <a href="tel:+33663463716" class="fab fab-call">📞</a>
  <a href="https://wa.me/33663463716" class="fab fab-whatsapp">💬</a>

  <div id="tarif-flottant"><span id="tarif-flottant-texte"></span></div>

  <script>
    const form = document.getElementById('reservation-form');
    const trajetSelect = document.getElementById('trajet-type');
    const datesRetourContainer = document.getElementById('dates-retour-container');

    trajetSelect.addEventListener('change', () => {
      datesRetourContainer.style.display = (trajetSelect.value === 'aller-retour') ? 'block' : 'none';
    });

    // VOTRE LOGIQUE DE CALCUL (BASE_TARIF, etc.) ICI ...
    // Note : Intégrez ici vos fonctions calculerTarif() et initMap() 
    // qui utilisent votre clé API Google.
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCA5J7_7fNdWgVsGRLWRfQZaO6qgCEqq_Y&callback=initMap&libraries=places" async defer></script>

</body>
</html>
