<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCVTC66 — Chauffeur VTC à Perpignan</title>
  <meta name="description" content="DCVTC66, chauffeur VTC à Perpignan, propose des trajets fiables, confortables et ponctuels dans tout le département 66." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=99" />
  <link rel="icon" type="image/png" href="LOGO DCVTC66.png">

  <style>
    /* --- NOUVEAU DESIGN PREMIUM (PARTIE HAUTE) --- */
    :root {
      --dark-blue: #0a192f;
      --gold-gradient: linear-gradient(180deg, #ffd700 0%, #ffb800 100%);
    }

    html, body { margin: 0; padding: 0; overflow-x: hidden; font-family: 'Poppins', sans-serif; }

    .header-premium {
      background-color: var(--dark-blue);
      color: #fff;
      text-align: center;
      padding: 2.5rem 1rem;
    }

    .logo-top { width: 110px; margin-bottom: 1rem; }

    .car-frame {
      border: 3px solid #ffd700;
      border-radius: 25px;
      overflow: hidden;
      max-width: 480px;
      margin: 1.5rem auto;
      background: #000;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .car-frame img { width: 100%; display: block; }

    .premium-title { font-size: 1.4rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; line-height: 1.3; }
    .premium-subtitle { font-size: 0.95rem; opacity: 0.85; margin-bottom: 2rem; }

    .hero-actions-premium { display: flex; flex-direction: column; gap: 0.8rem; max-width: 340px; margin: 0 auto; }
    
    .btn-gold-action {
      background: var(--gold-gradient);
      color: #000 !important;
      text-decoration: none;
      font-weight: 800;
      padding: 0.9rem;
      border-radius: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.2s;
    }
    .btn-gold-action:active { transform: scale(0.98); }
    .btn-gold-action span { font-size: 0.75rem; font-weight: 400; text-transform: none; }

    /* --- RESTE DE TON STYLE D'ORIGINE --- */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; box-sizing: border-box; }
    .section-alt { background: #f8fafc; padding: 3rem 0; }
    .form-compact { max-width: 560px; margin: 0 auto; }
    .form-compact .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .form-compact input, .form-compact select, .form-compact textarea { 
        width: 100%; padding: .85rem; border-radius: 14px; border: 1px solid #ddd; margin-top: 5px; box-sizing: border-box;
    }
    label { font-size: 0.85rem; font-weight: 600; display: block; margin-top: 10px; }

    .actions-compact { display: grid; grid-template-columns: 1fr 1.15fr; gap: .6rem; margin-top: 1.5rem; }
    .btn-estimate { background: #0a192f; color: white; border: none; border-radius: 999px; padding: 1rem; font-weight: 700; cursor: pointer; }
    .btn-send-sms { background: var(--gold-gradient); color: #000; border: none; border-radius: 999px; padding: 1rem; font-weight: 700; cursor: pointer; }
    .btn-wa { width: 100%; margin-top: 10px; background: #25d366; color: white; border: none; border-radius: 999px; padding: 1rem; font-weight: 700; cursor: pointer; }

    #tarif-flottant {
      position: fixed; top: 20px; left: 10px; right: 10px; z-index: 9999; display: none;
      padding: 0.8rem; border-radius: 50px; background: #16a34a; color: white; text-align: center; font-weight: 600;
    }

    #map { height: 300px; border-radius: 15px; margin-top: 1rem; }

    @media (max-width: 520px) { .form-compact .row { grid-template-columns: 1fr; } .actions-compact { grid-template-columns: 1fr; } }
  </style>
</head>

<body>

  <header class="header-premium">
    <div class="container">
      <img src="LOGO DCVTC66.png" alt="Logo DCVTC66" class="logo-top">
      
      <div class="car-frame">
        <img src="Toyota-Auris-Hybrid-Touring-Sports.0.jpg" alt="Toyota Auris Hybride DCVTC66">
      </div>

      <h1 class="premium-title">Chaque trajet, une expérience.<br>DCVTC66, votre chauffeur privé.</h1>
      <p class="premium-subtitle">À Perpignan et dans tout le 66. Laissez-nous vous conduire.</p>

      <div class="hero-actions-premium">
        <a href="tel:0663463716" class="btn-gold-action">
          📞 APPELER MAINTENANT
          <span>(Réponse Immédiate)</span>
        </a>
        <a href="#reservation" class="btn-gold-action">
          📅 ESTIMER VOTRE TRAJET
          <span>(Tarif fixe & sans engagement)</span>
        </a>
      </div>
    </div>
  </header>

  <section id="reservation" class="section section-alt">
    <div class="container">
      <h2 style="text-align:center;">Réservation & Prix</h2>
      <form id="reservation-form" class="form-compact">
        <div class="row">
          <label>Nom <input type="text" name="Nom" placeholder="Votre nom" required></label>
          <label>Téléphone <input type="tel" name="Téléphone" placeholder="06..." required></label>
        </div>

        <label>Type de trajet
          <select name="Trajet" id="trajet-type">
            <option value="simple">Aller simple</option>
            <option value="aller-retour">Aller-Retour (Remise -10% retour)</option>
          </select>
        </label>

        <label>Départ <input type="text" name="Départ" placeholder="Lieu de prise en charge" required></label>
        <label>Arrivée <input type="text" name="Arrivee" placeholder="Lieu de destination" required></label>

        <label>Date & Heure Aller <input type="datetime-local" name="DateHeureAller" required></label>

        <div id="dates-retour-container" style="display:none;">
          <label>Date & Heure Retour <input type="datetime-local" name="DateHeureRetour" id="date-retour"></label>
        </div>

        <label>Passagers
          <select name="Passagers" required>
            <option value="1">1 Passager</option>
            <option value="2">2 Passagers</option>
            <option value="3">3 Passagers</option>
            <option value="4">4 Passagers</option>
          </select>
        </label>

        <label>Mode de Paiement
          <select name="Paiement" required>
            <option value="CB à bord">CB à bord</option>
            <option value="Espèces">Espèces</option>
            <option value="Lien CB">Lien sécurisé (CB)</option>
          </select>
        </label>

        <div class="actions-compact">
          <button type="button" id="btn-tarif" class="btn-estimate">💰 Estimer le prix</button>
          <button type="submit" class="btn-send-sms">📩 Envoyer par SMS</button>
        </div>
        <button type="button" id="btn-whatsapp-form" class="btn-wa">💬 Envoyer par WhatsApp</button>

        <div id="resultat-tarif" style="margin-top:1rem; padding:1rem; background:#fff; border-radius:10px; display:none; border-left: 5px solid #ffd700;"></div>
        <div id="erreur-tarif" style="color:red; display:none; margin-top:10px;"></div>

        <div id="map"></div>
      </form>
    </div>
  </section>

  <div id="tarif-flottant">💰 <span id="tarif-flottant-texte"></span></div>

  <script>
    const form = document.getElementById('reservation-form');
    const trajetSelect = document.getElementById('trajet-type');
    const datesRetourContainer = document.getElementById('dates-retour-container');
    const dateRetourInput = document.getElementById('date-retour');

    trajetSelect.addEventListener('change', () => {
      datesRetourContainer.style.display = (trajetSelect.value === 'aller-retour') ? 'block' : 'none';
      dateRetourInput.required = (trajetSelect.value === 'aller-retour');
    });

    // --- ICI TA LOGIQUE DE CALCUL GOOGLE MAPS ---
    const BASE_KM = 7;
    const BASE_TARIF = 20;
    const SUPP_PAR_KM = 1.70;
    let derniereEstimation = null;

    function initMap() {
        const inputDep = document.querySelector('input[name="Départ"]');
        const inputArr = document.querySelector('input[name="Arrivee"]');
        new google.maps.places.Autocomplete(inputDep);
        new google.maps.places.Autocomplete(inputArr);
        
        const map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 42.6986, lng: 2.8956 }, zoom: 11
        });
        const ds = new google.maps.DirectionsService();
        const dr = new google.maps.DirectionsRenderer({ map: map });

        document.getElementById("btn-tarif").addEventListener("click", () => {
            const dep = inputDep.value;
            const arr = inputArr.value;
            if(!dep || !arr) return;

            ds.route({ origin: dep, destination: arr, travelMode: 'DRIVING' }, (res, status) => {
                if(status === "OK") {
                    dr.setDirections(res);
                    const distKm = res.routes[0].legs[0].distance.value / 1000;
                    let prix = BASE_TARIF;
                    if(distKm > BASE_KM) prix += (distKm - BASE_KM) * SUPP_PAR_KM;
                    
                    const finalPrix = trajetSelect.value === 'aller-retour' ? prix + (prix * 0.9) : prix;
                    derniereEstimation = { tarif: finalPrix, distance: distKm.toFixed(1) };

                    const resDiv = document.getElementById("resultat-tarif");
                    resDiv.style.display = "block";
                    resDiv.innerHTML = `<strong>Estimation : ${finalPrix.toFixed(2)} €</strong> (${distKm.toFixed(1)} km)`;
                    
                    const flottant = document.getElementById("tarif-flottant");
                    document.getElementById("tarif-flottant-texte").textContent = `${finalPrix.toFixed(2)} €`;
                    flottant.style.display = "block";
                }
            });
        });
    }

    // GESTION SMS & WHATSAPP
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        let txt = `Demande DCVTC66\nNom: ${form.Nom.value}\nDe: ${form.Départ.value}\nÀ: ${form.Arrivee.value}\nDate: ${form.DateHeureAller.value}`;
        if(derniereEstimation) txt += `\nEstimation: ${derniereEstimation.tarif.toFixed(2)}€`;
        window.location.href = `sms:+33663463716?body=${encodeURIComponent(txt)}`;
    });

    document.getElementById("btn-whatsapp-form").addEventListener("click", () => {
        let txt = `Demande DCVTC66\nNom: ${form.Nom.value}\nDe: ${form.Départ.value}\nÀ: ${form.Arrivee.value}`;
        window.open(`https://wa.me/33663463716?text=${encodeURIComponent(txt)}`, '_blank');
    });
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=TON_API_KEY_ICI&callback=initMap&libraries=places" async defer></script>
</body>
</html>
