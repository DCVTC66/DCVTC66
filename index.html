<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCVTC66 — Chauffeur Privé Perpignan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --primary: #ffd700;
      --text: #ffffff;
    }

    body { 
      font-family: 'Poppins', sans-serif; 
      margin: 0; 
      background-color: var(--bg); 
      color: var(--text);
      text-align: center;
    }

    .header { padding: 40px 20px; background: #080a0f; }
    
    .logo-main { max-width: 120px; margin-bottom: 20px; }
    
    /* Correction de l'image de la voiture */
    .car-img { 
      width: 90%; 
      max-width: 600px; 
      height: auto; 
      border-radius: 15px; 
      margin: 20px auto;
      display: block;
      border: 1px solid var(--primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 { color: var(--primary); margin: 10px 0; font-size: 2.2rem; }
    .subtitle { opacity: 0.8; font-size: 1.1rem; margin-bottom: 30px; }

    .btn-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
    
    .btn { 
      padding: 12px 30px; 
      border-radius: 50px; 
      text-decoration: none; 
      font-weight: bold; 
      color: #000;
      background: var(--primary);
    }

    .btn-wa { background: #25d366; color: #fff; }

    /* Zone Estimation */
    .booking-box { 
      background: var(--card); 
      max-width: 600px; 
      margin: -50px auto 40px; 
      padding: 30px; 
      border-radius: 20px;
      border: 1px solid #30363d;
    }

    input, select { 
      width: 100%; 
      padding: 12px; 
      margin: 10px 0; 
      border-radius: 8px; 
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      box-sizing: border-box;
    }

    #map { height: 300px; border-radius: 10px; margin-top: 20px; background: #21262d; }
    
    #resultat { 
        margin-top: 20px; 
        padding: 15px; 
        border: 1px solid var(--primary); 
        display: none; 
        border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="header">
  <img src="LOGO DCVTC66.png" alt="Logo" class="logo-main">
  <h1>DCVTC66</h1>
  <p class="subtitle">Chauffeur Privé Perpignan & Pyrénées-Orientales</p>
  
  <img src="toyota-auris.png" alt="Toyota Auris Hybride" class="car-img">

  <div class="btn-container">
    <a href="tel:0663463716" class="btn">📞 06 63 46 37 16</a>
    <a href="https://wa.me/33663463716" class="btn btn-wa">💬 WhatsApp</a>
  </div>
</div>

<div class="booking-box">
  <h3>Estimer mon trajet</h3>
  <input type="text" id="dep" placeholder="Lieu de départ">
  <input type="text" id="arr" placeholder="Destination">
  <select id="type">
    <option value="1">Aller Simple</option>
    <option value="2">Aller-Retour (-10% sur retour)</option>
  </select>
  <button onclick="estimer()" class="btn" style="width:100%; border:none; cursor:pointer; margin-top:10px;">💰 Calculer le prix</button>
  
  <div id="resultat">
    <div id="dist"></div>
    <div style="font-size: 2rem; color: var(--primary); font-weight: bold;" id="prix"></div>
  </div>

  <div id="map"></div>
</div>

<script>
  // Remplacez par votre clé API pour activer la carte et le calcul
  const API_KEY = 'VOTRE_CLE_GOOGLE_MAPS_ICI';

  function estimer() {
    const prixDiv = document.getElementById('resultat');
    prixDiv.style.display = 'block';
    document.getElementById('prix').innerText = "25.00 €"; 
    document.getElementById('dist').innerText = "Distance estimée : 12 km";
    // Le calcul réel nécessite l'activation de votre clé API Google
  }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=VOTRE_CLE_GOOGLE_MAPS_ICI&libraries=places"></script>

</body>
</html>
