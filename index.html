<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCVTC66 — Chauffeur VTC à Perpignan</title>
  <meta name="description" content="DCVTC66, chauffeur VTC à Perpignan, propose des trajets fiables, confortables et ponctuels dans tout le département 66 et au-delà. Réservation simple et rapide." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=99" />
  <link rel="icon" type="image/png" href="LOGO DCVTC66.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="canonical" href="https://dcvtc66.fr/" />

  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; font-family: 'Poppins', sans-serif; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; box-sizing: border-box; }

    /* --- STYLE DU HEADER AVEC LA TOYOTA AURIS --- */
    .header { background: #001a33; color: white; padding: 2rem 0; text-align: center; }
    .logo { max-width: 120px; margin-bottom: 1rem; }
    
    .hero-car-wrapper {
      margin: 1.5rem auto;
      max-width: 600px;
      padding: 0 1rem;
    }
    .hero-car {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    .nav-inner ul { display: flex; gap: 1rem; list-style: none; padding: 1rem; margin: 0; justify-content: center; background: #000c1a; }
    .nav-inner ul li a { text-decoration: none; color: white; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }

    .hero-actions { display: flex; gap: 0.55rem; margin-top: 1.5rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary { background: linear-gradient(135deg, #ffd700, #ffb700); color: #001a33; border: none; padding: 0.7rem 1.2rem; border-radius: 999px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; transition: 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4); }

    /* --- FORMULAIRE & ESTIMATION --- */
    #tarif-flottant {
      position: fixed; top: 24px; right: 24px; z-index: 9999; display: none; align-items: center; gap: 0.75rem;
      padding: 0.9rem 1.3rem; border-radius: 999px; background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #fff; box-shadow: 0 16px 40px rgba(22, 163, 74, 0.7); font-size: 0.95rem; font-weight: 600; max-width: 90vw;
      border: 1px solid rgba(6, 95, 70, 0.75); animation: pulseTarif 1.6s ease-in-out infinite;
    }
    @keyframes pulseTarif {
      0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); }
    }

    .form-compact { max-width: 560px; margin: 2rem auto; padding: 1rem; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .form-compact .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .form-compact label { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; font-weight: 600; margin-bottom: 0.5rem; }
    .form-compact input, .form-compact select, .form-compact textarea { padding: .75rem; border-radius: 12px; border: 1px solid #ddd; font-family: inherit; }
    
    .actions-compact { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .75rem; }
    .btn-estimate { background: #001a33; color: white; border-radius: 999px; padding: .9rem; border: none; font-weight: 800; cursor: pointer; }
    .email-action { margin-top: .6rem; width: 100%; justify-content: center; background: #25d366; color: white; }

    .result-compact { margin-top: .6rem; padding: 1rem; background: #f0f7ff; color: #1b3b68; border-radius: 12px; font-size: 0.9rem; }
    .map-wrapper { margin-top: .7rem; border-radius: 16px; overflow: hidden; height: 300px; }
    #map { width: 100%; height: 100%; }

    @media (max-width: 520px) {
      .form-compact .row, .actions-compact { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="container nav-inner">
      <ul>
        <li><a href="#reservation">Réservation</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="header">
    <div class="container header-inner">
      <div class="branding">
        <img src="LOGO DCVTC66.png" alt="Logo DCVTC66" class="logo">
        
        <div class="hero-car-wrapper">
          <img src="toyota-auris.png" alt="Toyota Auris Hybride DCVTC66" class="hero-car">
        </div>

        <h1 class="site-title" style="color:#ffd700; margin:0;">DCVTC66</h1>
        <p class="site-subtitle">Chauffeur VTC privé à Perpignan et dans le (66)</p>

        <div class="hero-actions">
          <a href="tel:0663463716" class="btn-primary">📞 Appeler</a>
          <a href="https://wa.me/33663463716" target="_blank" class="btn-primary">💬 WhatsApp</a>
          <a href="#reservation" class="btn-primary">📝 Réserver</a>
        </div>
      </div>
    </div>
  </header>

  <section id="reservation" class="section">
    <div class="container">
      <h2 style="text-align:center; margin-top:2rem;">Estimation & Réservation</h2>
      <form id="reservation-form" class="form-compact">
        <div class="row">
          <label>Nom <input type="text" name="Nom" placeholder="Votre nom" required></label>
          <label>Téléphone <input type="tel" name="Téléphone" placeholder="06..." required></label>
        </div>

        <label>Type de trajet
          <select name="Trajet" id="trajet-type">
            <option value="simple">Aller simple</option>
            <option value="aller-retour">Aller-Retour (-10% sur le retour)</option>
          </select>
        </label>

        <label>Départ <input type="text" name="Départ" id="input-depart" placeholder="Lieu de prise en charge" required></label>
        <label>Arrivée <input type="text" name="Arrivee" id="input-arrivee" placeholder="Destination" required></label>

        <label>Date & heure aller <input type="datetime-local" name="DateHeureAller" required></label>

        <div id="dates-retour-container" style="display:none;">
          <label>Date & heure retour <input type="datetime-local" name="DateHeureRetour" id="date-retour"></label>
        </div>

        <div class="row">
          <label>Passagers
            <select name="Passagers" required>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
            </select>
          </label>
          <label>Paiement
            <select name="Paiement" required>
              <option value="CB à bord">CB à bord</option>
              <option value="Espèces">Espèces</option>
              <option value="Lien sécurisé">Lien CB</option>
            </select>
          </label>
        </div>

        <div class="actions-compact">
          <button type="button" id="btn-tarif" class="btn-estimate">💰 Estimer</button>
          <button type="submit" class="btn-primary" style="justify-content:center;">📩 Par SMS</button>
        </div>
        <button type="button" id="btn-whatsapp-form" class="btn-primary email-action">💬 Par WhatsApp</button>

        <div id="resultat-tarif" class="result-compact" style="display:none;"></div>
        <div id="erreur-tarif" style="color:red; display:none; margin-top:10px;"></div>

        <div class="map-wrapper"><div id="map"></div></div>
      </form>
    </div>
  </section>

  <footer style="background:#000c1a; color:white; text-align:center; padding:2rem 0; margin-top:3rem;">
    <p>© <span id="year"></span> DCVTC66 — +33 6 63 46 37 16</p>
  </footer>

  <div id="tarif-flottant"><span id="tarif-flottant-texte"></span></div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const form = document.getElementById('reservation-form');
    const trajetSelect = document.getElementById('trajet-type');
    const datesRetourContainer = document.getElementById('dates-retour-container');

    trajetSelect.addEventListener('change', () => {
      datesRetourContainer.style.display = trajetSelect.value === 'aller-retour' ? 'block' : 'none';
    });

    // --- LOGIQUE CALCUL TARIF (VOTRE CODE INITIAL) ---
    const BASE_KM = 7; const BASE_TARIF = 20; const SUPP_PAR_KM = 1.70;
    let derniereEstimation = null;
    let map, distanceService, directionsRenderer, directionsService;

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), { center: { lat: 42.6986, lng: 2.8956 }, zoom: 12 });
      distanceService = new google.maps.DistanceMatrixService();
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ map: map });

      new google.maps.places.Autocomplete(document.getElementById('input-depart'), { componentRestrictions: { country: 'fr' } });
      new google.maps.places.Autocomplete(document.getElementById('input-arrivee'), { componentRestrictions: { country: 'fr' } });
    }

    document.getElementById("btn-tarif").addEventListener("click", function() {
      const dep = form["Départ"].value; const arr = form["Arrivee"].value;
      if (!dep || !arr) return alert("Saisissez un départ et une arrivée");

      distanceService.getDistanceMatrix({
        origins: [dep], destinations: [arr], travelMode: 'DRIVING', unitSystem: google.maps.UnitSystem.METRIC
      }, (response, status) => {
        if (status !== "OK") return;
        const element = response.rows[0].elements[0];
        const distKm = element.distance.value / 1000;
        let tarif = BASE_TARIF + (distKm > BASE_KM ? (distKm - BASE_KM) * SUPP_PAR_KM : 0);
        
        if (trajetSelect.value === "aller-retour") {
           tarif = tarif + (tarif * 0.9); // -10% sur le retour
        }

        derniereEstimation = { tarif, distance: distKm.toFixed(1) };
        const resDiv = document.getElementById("resultat-tarif");
        resDiv.innerHTML = `Distance : <strong>${distKm.toFixed(1)} km</strong><br>Prix estimé : <strong>${tarif.toFixed(2)} €</strong>`;
        resDiv.style.display = "block";
        
        directionsService.route({ origin: dep, destination: arr, travelMode: 'DRIVING' }, (res, st) => {
          if (st === "OK") directionsRenderer.setDirections(res);
        });
      });
    });

    // --- ENVOI SMS & WHATSAPP ---
    function genererMessage() {
      let msg = `Demande DCVTC66 :\nNom: ${form.Nom.value}\nDépart: ${form.Départ.value}\nArrivée: ${form.Arrivee.value}\nTrajet: ${trajetSelect.value}`;
      if (derniereEstimation) msg += `\nEstimation: ${derniereEstimation.tarif.toFixed(2)}€`;
      return msg;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = `sms:+33663463716?&body=${encodeURIComponent(genererMessage())}`;
    });

    document.getElementById("btn-whatsapp-form").addEventListener("click", () => {
      window.open(`https://wa.me/33663463716?text=${encodeURIComponent(genererMessage())}`, "_blank");
    });
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCA5J7_7fNdWgVsGRLWRfQZaO6qgCEqq_Y&callback=initMap&libraries=places" async defer></script>
</body>
</html>
