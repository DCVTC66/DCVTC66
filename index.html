<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCVTC66 — Chauffeur VTC à Perpignan</title>
  <meta name="description" content="DCVTC66, votre chauffeur privé à Perpignan. Service premium, ponctualité et tarifs fixes." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    /* VOTRE STYLE PERSONNALISÉ */
    :root {
      --bg-main: #0b1733;
      --bg-light: #102a5c;
      --bg-alt: #1e4696;
      --primary: #facc15;
      --primary-soft: rgba(250, 204, 21, 0.22);
      --text-main: #f8fafc;
      --text-muted: #b6ccff;
      --card-bg: rgba(16, 42, 92, 0.88);
      --border-soft: rgba(186, 204, 255, 0.35);
      --error: #f87171;
      --shadow-soft: 0 20px 50px rgba(2, 6, 23, 0.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 15% 10%, rgba(250, 204, 21, 0.25), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(56, 189, 248, 0.45), transparent 50%),
        linear-gradient(to bottom, var(--bg-main), var(--bg-light) 45%, var(--bg-alt));
      background-attachment: fixed;
      line-height: 1.6;
    }

    .container { max-width: 550px; margin: 0 auto; padding: 0 1.2rem; }

    /* HEADER & LOGO */
    .header { padding: 2.5rem 0 1.5rem; text-align: center; }
    .branding {
      background: var(--card-bg);
      border-radius: 1.6rem;
      padding: 2rem 1.5rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-soft);
    }
    .logo {
      width: 110px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      padding: 4px;
      background: var(--bg-main);
      margin-bottom: 1rem;
    }
    .site-title {
      font-family: "Playfair Display", serif;
      font-size: 2.2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0;
    }
    .site-subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    /* CADRE VOITURE */
    .car-card {
      margin: 1.5rem 0;
      border-radius: 1.2rem;
      overflow: hidden;
      border: 2px solid var(--primary);
      box-shadow: var(--shadow-soft);
    }
    .car-card img { width: 100%; display: block; }

    /* BOUTONS JAUNES */
    .btn-primary {
      background: linear-gradient(135deg, #fde047, #facc15);
      color: #0b1733 !important;
      padding: 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(250, 204, 21, 0.3);
    }

    /* FORMULAIRE */
    .form-box {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 1.4rem;
      border: 1px solid var(--border-soft);
      margin-top: 2rem;
    }
    .form-box h2 { font-family: "Playfair Display", serif; text-align: center; margin-top: 0; }
    input {
      width: 100%;
      padding: 0.85rem;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(11,23,51,0.5);
      color: white;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    /* BADGES */
    .badges {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 1.5rem;
    }
    .badge {
      background: rgba(16, 42, 92, 0.85);
      padding: 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      border: 1px solid var(--border-soft);
      text-align: center;
    }
    .badge b { color: var(--primary); }

    /* FLOATING WHATSAPP */
    .fab-wa {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25d366;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      text-decoration: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container">
      <div class="branding">
        <img src="LOGO DCVTC66.png" alt="Logo DCVTC66" class="logo">
        <h1 class="site-title">DCVTC66</h1>
        <p class="site-subtitle">Chauffeur Privé • Perpignan (66)</p>

        <div class="car-card">
          <img src="1000000068.jpg" alt="Toyota Auris Blanche DCVTC66">
        </div>

        <a href="tel:0663463716" class="btn-primary">📞 APPELER MAINTENANT</a>
        <a href="https://wa.me/33663463716" class="btn-primary">💬 WHATSAPP</a>
        <a href="#reservation" class="btn-primary" style="background: white; box-shadow: none;">📝 ESTIMER MON TARIF</a>

        <div class="badges">
          <div class="badge"><b>✓</b> Tarifs Fixes</div>
          <div class="badge"><b>✓</b> CB / Espèces</div>
          <div class="badge"><b>✓</b> Gares & Aéroports</div>
          <div class="badge"><b>✓</b> Disponible 7j/7</div>
        </div>
      </div>
    </div>
  </header>

  <section id="reservation" class="container" style="padding-bottom: 3rem;">
    <div class="form-box">
      <h2>Réservation</h2>
      <form onsubmit="sendSMS(event)">
        <input type="text" id="dep" placeholder="Lieu de départ..." required>
        <input type="text" id="arr" placeholder="Lieu d'arrivée..." required>
        
        <button type="button" onclick="calculatePrice()" class="btn-primary" style="background: #16a34a; color: white !important; font-size: 0.8rem; height: 50px;">
          Calculer le prix
        </button>

        <div id="price-display" style="display:none; text-align:center; padding: 10px; border: 1px dashed var(--primary); margin-bottom: 10px; border-radius: 10px;">
          Estimation : <strong style="color:var(--primary); font-size: 1.2rem;"><span id="price-val">--</span> €</strong>
        </div>

        <button type="submit" class="btn-primary">Envoyer la demande SMS</button>
      </form>
    </div>
  </section>

  <a href="https://wa.me/33663463716" class="fab-wa">💬</a>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCA5J7_7fNdWgVsGRLWRfQZaO6qgCEqq_Y&libraries=places"></script>
  
  <script>
    // Autocomplete Google Maps
    const depInput = document.getElementById('dep');
    const arrInput = document.getElementById('arr');
    new google.maps.places.Autocomplete(depInput);
    new google.maps.places.Autocomplete(arrInput);

    function calculatePrice() {
      const service = new google.maps.DistanceMatrixService();
      service.getDistanceMatrix({
        origins: [depInput.value],
        destinations: [arrInput.value],
        travelMode: 'DRIVING'
      }, (response, status) => {
        if (status === 'OK') {
          const distance = response.rows[0].elements[0].distance.value / 1000;
          let prix = 20 + (distance > 7 ? (distance - 7) * 1.6 : 0);
          document.getElementById('price-val').innerText = prix.toFixed(2);
          document.getElementById('price-display').style.display = 'block';
        }
      });
    }

    function sendSMS(e) {
      e.preventDefault();
      const text = `Demande DCVTC66 : De ${depInput.value} à ${arrInput.value}`;
      window.location.href = `sms:+33663463716?body=${encodeURIComponent(text)}`;
    }
  </script>

</body>
</html>
